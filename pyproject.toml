    { name = "Abhinav-Jain252", email = "jainabhinav478@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
